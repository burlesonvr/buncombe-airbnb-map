
<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Buncombe County Airbnbs (2020)</title>

    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.7.0/dist/leaflet.css">
    <link rel="stylesheet" href="https://use.fontawesome.com/releases/v5.14.0/css/all.css">
    <link href="https://fonts.googleapis.com/css?family=Titillium+Web" rel="stylesheet">

    <style>
        html, body, #map {
            width: 100%;
            height: 100%;
            margin: 0;
            background: #fff;
            font-family: 'Titillium Web', sans-serif;
        }

        .legend {
            line-height: 40px;
            font-size: 16px;
            width: 190px;
            color: #333333;
            padding: 6px 8px;
            background: rgba(255,255,255,0.85);
            box-shadow: 0 0 15px rgba(0,0,0,0.2);
            border-radius: 5px;
            font-family: 'Titillium Web', sans-serif;
        }

        .legend i {
            width: 20px;
            height: 20px;
            float: left;
            margin-right: 8px;
            opacity: 0.9;
        }

        .legend p {
            font-size: 14px;
            line-height: 20px;
            margin: 0;
        }
    </style>

    <script src="https://unpkg.com/leaflet@1.7.0/dist/leaflet.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet-ajax/2.1.0/leaflet.ajax.min.js"></script>
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.1.0/jquery.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chroma-js/1.3.4/chroma.min.js"></script>
</head>

<body>
<div id="map"></div>

<script>
    // 1. Create map
    var mymap = L.map('map', {
        center: [35.5946, -82.5540],
        zoom: 11,
        maxZoom: 18,
        minZoom: 11,
        detectRetina: true
    });

    // 2. Add OpenStreetMap basemap
    L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '&copy; OpenStreetMap contributors',
        maxZoom: 18
    }).addTo(mymap);

    // 3. Create Airbnb marker colors
    var markerColors = chroma.scale('Dark2').mode('lch').colors(3);

    for (var i = 0; i < 3; i++) {
        $('head').append(
            $("<style> .marker-color-" + (i + 1) +
            " { color: " + markerColors[i] +
            "; font-size: 15px; text-shadow: 0 0 3px #ffffff;} </style>")
        );
    }

    // 4. Create choropleth colors
    var colors = chroma.scale('Purples').colors(5);

    function setColor(density) {
        var id = 0;

        if (density > 106) {
            id = 4;
        } else if (density > 79) {
            id = 3;
        } else if (density > 52) {
            id = 2;
        } else if (density > 25) {
            id = 1;
        }

        return colors[id];
    }

    // 5. Style zoning districts
    function style(feature) {
        return {
            fillColor: setColor(feature.properties.total_bnbs),
            fillOpacity: 0.4,
            weight: 2,
            opacity: 1,
            color: '#b4b4b4',
            dashArray: '4'
        };
    }

    // 6. Add zoning polygons
    var zoning = L.geoJson.ajax("assets/zoning_districts.geojson", {
        style: style,

        onEachFeature: function(feature, layer) {
            layer.bindPopup(
                "Airbnbs in district: " + feature.properties.total_bnbs
            );
        },

        attribution: 'Asheville Zoning Districts &copy; City of Asheville Open Data'
    }).addTo(mymap);

    // 7. Add Airbnb point markers
    var airbnb_listings = L.geoJson.ajax("assets/airbnb_listings.geojson", {

        pointToLayer: function(feature, latlng) {
            var id = 0;

            if (feature.properties.property_t == "Entire house") {
                id = 0;
            } else if (feature.properties.property_t == "Private room in house") {
                id = 1;
            } else {
                id = 2;
            }

            return L.marker(latlng, {
                icon: L.divIcon({
                    className: 'fab fa-airbnb marker-color-' + (id + 1)
                })
            });
        },

        onEachFeature: function(feature, layer) {
            layer.bindPopup(feature.properties.property_t);
        },

        attribution: 'Airbnb Listings &copy; Inside Airbnb | Map Author: Victoria Burleson'
    });

    // Keep Airbnb markers above zoning polygons
    zoning.on('data:loaded', function() {
        airbnb_listings.addTo(mymap);
    });

    // 8. Create legend
    var legend = L.control({position: 'topright'});

    legend.onAdd = function() {
        var div = L.DomUtil.create('div', 'legend');

        div.innerHTML += '<b>Airbnbs per District</b><br />';
        div.innerHTML += '<i style="background:' + colors[4] + '; opacity:0.5"></i><p>107+</p>';
        div.innerHTML += '<i style="background:' + colors[3] + '; opacity:0.5"></i><p>80-106</p>';
        div.innerHTML += '<i style="background:' + colors[2] + '; opacity:0.5"></i><p>53-79</p>';
        div.innerHTML += '<i style="background:' + colors[1] + '; opacity:0.5"></i><p>26-52</p>';
        div.innerHTML += '<i style="background:' + colors[0] + '; opacity:0.5"></i><p>0-25</p>';

        div.innerHTML += '<hr><b>Property Type</b><br />';
        div.innerHTML += '<i class="fab fa-airbnb marker-color-1"></i><p>Entire house</p>';
        div.innerHTML += '<i class="fab fa-airbnb marker-color-2"></i><p>Private room in house</p>';
        div.innerHTML += '<i class="fab fa-airbnb marker-color-3"></i><p>Other</p>';

        return div;
    };

    legend.addTo(mymap);

    // 9. Add scale bar
    L.control.scale({
        position: 'bottomleft'
    }).addTo(mymap);

</script>
</body>
</html>
